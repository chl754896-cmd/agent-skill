name: EvalForge Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      skill_path:
        description: "包含 SKILL.md 的 Skill 目录"
        required: true
        default: "examples/resume-review"
        type: string
      use_ai:
        description: "是否启用 DeepSeek AI 辅助"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v7

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装项目
        run: python -m pip install -e .

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

  generate-report:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v7

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装项目
        run: python -m pip install -e .

      - name: 分析并生成评测 Case
        env:
          SKILL_PATH: ${{ inputs.skill_path }}
          USE_AI: ${{ inputs.use_ai }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "$USE_AI" = "true" ]; then
            evalforge analyze "$SKILL_PATH" --use-ai
            evalforge generate "$SKILL_PATH" --use-ai
          else
            evalforge analyze "$SKILL_PATH"
            evalforge generate "$SKILL_PATH"
          fi

      - name: 生成评测报告
        run: |
          evalforge evaluate eval_cases.json
          evalforge report eval_results.json

      - name: 上传审核报告
        uses: actions/upload-artifact@v7
        with:
          name: evalforge-result
          path: |
            eval_cases.json
            eval_report.md
            eval_report.json
